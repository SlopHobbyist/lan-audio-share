[package]
name = "lan-audio-share"
version = "0.1.0"
edition = "2024"
# Set by egui/eframe 0.35, the highest requirement in the tree. Declaring it
# makes cargo say so up front instead of failing partway through a build.
rust-version = "1.92"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
directories = "6.0.0"
eframe = "0.35.0"
hostname = "0.4.2"
if-addrs = "0.15.0"
ringbuf = "0.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"

# Debug builds still have to keep up with a real-time audio callback, so the
# unoptimised default is not usable for actually listening to the result.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# Media key forwarding. There is no portable way to claim or synthesise a media
# key, so each platform gets the APIs it needs and nothing more. Every one of
# these is already in the tree via eframe, so none of it is a new build cost.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(target_os = \"macos\")".dependencies]
# Default features here would drag in most of AppKit (CloudKit, Core Data and
# friends); only the three modules this uses are asked for.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSEvent",
    "NSGraphicsContext",
    "objc2-core-graphics",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFMachPort",
    "CFRunLoop",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventTypes",
] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
