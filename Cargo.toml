[package]
name = "lan-audio-share"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
directories = "6.0.0"
eframe = "0.35.0"
hostname = "0.4.2"
ringbuf = "0.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"

# Debug builds still have to keep up with a real-time audio callback, so the
# unoptimised default is not usable for actually listening to the result.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
